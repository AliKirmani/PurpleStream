name: Build release files for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish src/PurpleStream/PurpleStream.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish
      - name: Build installer, portable ZIP and hashes
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: release-files-review-before-publishing
          path: artifacts/release/
          if-no-files-found: error
